{#- Document metadata; included by the `head` block of deck.html. Stylesheets are emitted
    by the `styles` block of deck.html, not here. -#}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ meta.title or "Presentation" }}</title>
{%- if meta.description %}
<meta name="description" content="{{ meta.description }}">
{%- endif %}
{%- if meta.author %}
<meta name="author" content="{{ meta.author }}">
{%- endif %}
