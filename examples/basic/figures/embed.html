<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Embedded page</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; font: 28px/1.3 system-ui, sans-serif; color: #1f2937;
    background: linear-gradient(135deg, #eff6ff, #fff7ed);
  }
  button {
    font: inherit; padding: 8px 24px; border: 2px solid #2563eb; border-radius: 8px;
    background: #fff; color: #2563eb; cursor: pointer;
  }
  output { font-weight: 700; color: #ea580c; }
</style>
</head>
<body>
<p>A local HTML page in an <code>&lt;iframe&gt;</code>.</p>
<button type="button" id="count">Clicked <output>0</output> times</button>
<script>
  var clicks = 0;
  document.getElementById("count").addEventListener("click", function () {
    clicks += 1;
    this.querySelector("output").textContent = String(clicks);
  });
</script>
</body>
</html>
